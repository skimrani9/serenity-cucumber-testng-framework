# Serenity configuration (HOCON).
# Base URL for local app: http://localhost:5173/ (see environments below).

serenity {
  logging = VERBOSE
  take.screenshots = FOR_FAILURES
}

webdriver {
  driver = chrome
  waits {
    implicitlywait = 5000
  }
}

environments {
  qa {
    webdriver.base.url = "http://localhost:5173"
  }
  default {
    webdriver.base.url = "http://localhost:5173"
  }
}
