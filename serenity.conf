# Serenity configuration (HOCON).
  # QA: https://qa.manthan.justo.co.in/

serenity {
  logging = VERBOSE
  take.screenshots = FOR_FAILURES
  browser {
    maximized = true
  }
}

webdriver {
  driver = chrome
  capabilities {
    "goog:chromeOptions" {
      # Site "Show notifications" prompts + quieter password UI during automation.
      args = ["--start-maximized", "--disable-notifications"]
      prefs {
        "credentials_enable_service" = false
        "profile.password_manager_enabled" = false
        # Suppress Chrome's "password found in a data breach / change your password" modal.
        "profile.password_manager_leak_detection" = false
        # Block notification permission banners (numeric map: 2 = Block).
        "profile.default_content_setting_values.notifications" = 2
      }
    }
  }
  waits {
    implicitlywait = 5000
  }
}

environments {
  qa {
    webdriver.base.url = "https://qa.manthan.justo.co.in"
  }
  default {
    webdriver.base.url = "https://qa.manthan.justo.co.in"
  }
}
